# =============================================================================
# LiteLLM Proxy config
# Docs: https://docs.litellm.ai/docs/proxy/configs
# =============================================================================

model_list:
  # ---- OpenAI ----------------------------------------------------------------
  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY

  # ---- Anthropic -------------------------------------------------------------
  - model_name: claude-opus-4.8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4.6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---- Google Gemini ---------------------------------------------------------
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # ---- DeepSeek --------------------------------------------------------------
  # input/output_cost_per_token required because these model IDs are not in
  # LiteLLM's built-in price map — without them spend is always logged as $0.
  # Prices from https://api-docs.deepseek.com/quick_start/pricing (2026-06).
  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-0324
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.00000027   # $0.27 / 1M input tokens
      output_cost_per_token: 0.0000011   # $1.10 / 1M output tokens

  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-chat      # deepseek-v3-0324; the current "flash" tier
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.00000007   # $0.07 / 1M input tokens (cache miss)
      output_cost_per_token: 0.0000003   # $0.30 / 1M output tokens

  # ---- Local (Ollama) --------------------------------------------------------
  # Pull the model first:  docker exec -it ollama ollama pull llama3.1
  - model_name: llama3.1-local
    litellm_params:
      model: ollama/llama3.1
      api_base: http://ollama:11434

  # ---- Routing demo: one alias, two backends, load-balanced + fallback -------
  # Calls to "smart" round-robin across these; if one fails, LiteLLM retries
  # the next deployment (see router_settings + fallbacks below).
  - model_name: smart
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
  - model_name: smart
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

# -----------------------------------------------------------------------------
# General settings: master key + DB enable virtual keys, budgets, spend UI.
# -----------------------------------------------------------------------------
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# -----------------------------------------------------------------------------
# litellm_settings: global behaviour + guard-rails on what keys can request.
# -----------------------------------------------------------------------------
litellm_settings:
  drop_params: true            # ignore unsupported params instead of erroring
  num_retries: 2
  request_timeout: 600
  # --- Observability ---------------------------------------------------------
  # Log every request/response to Langfuse (traces, prompts, intent, skills).
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Expose Prometheus metrics on GET /metrics for Prometheus to scrape.
  # NOTE: some advanced Prometheus metrics need a LiteLLM Enterprise license;
  #       basic request/latency/spend metrics work on the OSS image.
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false   # allow Prometheus to scrape /metrics unauthenticated
  # Default ceilings applied when minting virtual keys (override per-key).
  upperbound_key_generate_params:
    max_budget: 100            # USD
    budget_duration: "30d"

# -----------------------------------------------------------------------------
# Router: cross-provider load balancing + fallbacks (multi-provider goal).
# -----------------------------------------------------------------------------
router_settings:
  routing_strategy: simple-shuffle
  # Per-model fallback chains. Local llama is the last resort so requests
  # still succeed even when paid providers are out of credit/quota.
  fallbacks:
    - gpt-5.5: ["claude-sonnet-4.6", "llama3.1-local"]
    - claude-opus-4.8: ["claude-sonnet-4.6", "gpt-5.5", "llama3.1-local"]
    - claude-sonnet-4.6: ["gpt-5.5", "llama3.1-local"]
    - gemini-2.5-pro: ["gemini-2.5-flash", "llama3.1-local"]
    - gemini-2.5-flash: ["llama3.1-local"]
    - deepseek-v4-pro: ["deepseek-v4-flash", "llama3.1-local"]
    - deepseek-v4-flash: ["llama3.1-local"]
  # Catch-all: any model group without its own rule falls back to local.
  default_fallbacks: ["llama3.1-local"]
